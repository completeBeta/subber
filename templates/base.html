<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Subber{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f1117' stroke='%236c8cff' stroke-width='4'/><text x='50' y='68' text-anchor='middle' font-size='42' fill='%236c8cff' font-family='sans-serif' font-weight='bold'>Sub</text></svg>">
    <link rel="stylesheet" href="/static/style.css?v=2">
    <link rel="stylesheet" href="/static/library.css?v=2">
</head>
<body>
    <header>
        <h1>Subber</h1>
        <span class="tagline">Subtitle Translator</span>
    </header>

    <nav class="tab-bar">
        <a href="/grab" class="tab {% block tab_grab_class %}{% endblock %}">Grab</a>
        <a href="/" class="tab {% block tab_translate_class %}{% endblock %}">Translate</a>
        <a href="/library" class="tab {% block tab_library_class %}{% endblock %}">Library</a>
        <a href="/search" class="tab {% block tab_search_class %}{% endblock %}">Search</a>
        <a href="/logs" class="tab {% block tab_logs_class %}{% endblock %}">Logs</a>
        <a href="/settings" class="tab {% block tab_settings_class %}{% endblock %}">Settings</a>
    </nav>

    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Files are automatically removed after 24 hours. <span style="opacity: 0.6; margin-left: 0.5rem;">{{ app_version }}</span></p>
    </footer>

    <div id="hover-tip" role="tooltip" aria-hidden="true"></div>

    <script>
    // ── Hover-help ───────────────────────────────────────────────────────────
    // Any element with class "info-tip" and a data-tip attribute shows its text
    // on hover, on keyboard focus, and on tap (a tap focuses a tabindex="0"
    // element, and focusout hides it again). The bubble is one position:fixed
    // node so it never alters page layout or scroll width.
    (function () {
        var tip = document.getElementById('hover-tip');
        if (!tip) return;
        var current = null;

        function place(el) {
            var r = el.getBoundingClientRect();
            var gap = 8, margin = 8;
            var tw = tip.offsetWidth, th = tip.offsetHeight;
            var left, top;
            // Sit above the icon and centre on it. That is the conventional
            // tooltip position, and it overlaps only the card's heading text
            // rather than the input the user is about to type into — every icon
            // here has a control directly beneath it. Flip below only when the
            // top of the viewport is in the way.
            left = r.left + r.width / 2 - tw / 2;
            left = Math.max(margin, Math.min(left, window.innerWidth - tw - margin));
            top = r.top - th - gap;
            if (top < margin) top = r.bottom + gap;
            if (top + th > window.innerHeight - margin) top = margin;
            tip.style.left = Math.round(left) + 'px';
            tip.style.top = Math.round(top) + 'px';
        }

        function show(el) {
            var text = el.getAttribute('data-tip');
            if (!text) return;
            current = el;
            tip.textContent = text;
            tip.classList.add('show');
            tip.setAttribute('aria-hidden', 'false');
            place(el);
        }

        function hide(el) {
            if (el && current !== el) return;
            current = null;
            tip.classList.remove('show');
            tip.setAttribute('aria-hidden', 'true');
        }

        function closestTip(node) {
            return node && node.closest ? node.closest('.info-tip') : null;
        }

        // Mouse: plain hover. Pointer type is checked because a tap on a touch
        // device also synthesises mouseover/mouseout, and that synthetic
        // mouseout arrives *after* the tap — it would dismiss the bubble the tap
        // just opened. Touch therefore gets its own path below.
        document.addEventListener('pointerover', function (e) {
            var el = closestTip(e.target);
            if (el && e.pointerType === 'mouse') show(el);
        });
        document.addEventListener('pointerout', function (e) {
            var el = closestTip(e.target);
            if (el && e.pointerType === 'mouse') hide(el);
        });

        // Touch / pen: tap the ⓘ to open. A tap on anything else blurs it, and
        // the focusout handler below closes the bubble.
        document.addEventListener('pointerdown', function (e) {
            var el = closestTip(e.target);
            if (el && e.pointerType !== 'mouse') show(el);
        });
        document.addEventListener('click', function (e) {
            if (!closestTip(e.target)) hide(current);
        });

        // Keyboard: the ⓘ is tabindex="0", so focus shows it.
        document.addEventListener('focusin', function (e) {
            var el = closestTip(e.target);
            if (el) show(el);
        });
        document.addEventListener('focusout', function () { hide(current); });
        window.addEventListener('scroll', function () {
            if (current) hide(current);
        }, true);
        window.addEventListener('resize', function () {
            if (current) hide(current);
        });
    })();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
