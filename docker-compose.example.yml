services:
  subber:
    build: .
    container_name: subber
    volumes:
    - ./uploads:/app/uploads
    - ./config:/app/config
    - ./data:/app/data
    # Uncomment and set your media paths:
    # - /path/to/your/media:/mnt/library:rw
    # - /mnt/smb-share:/mnt/smb-share:rw  # SMB/CIFS example
    environment:
    - SUBBER_CONFIG=/app/config/config.yaml
    - SUBBER_PORT=8676            # change this to run on a different port
    privileged: true  # Required for SMB/CIFS mount support
    network_mode: host            # host networking: the app binds SUBBER_PORT directly
    restart: unless-stopped
