# Subber Configuration
# Copy to config/config.yaml (Docker) or ~/.config/subber/config.yaml (standalone)
# All settings can also be configured via the Web UI at /settings

# --- Translation ---
translation:
  source_lang: auto
  target_lang: en
  temperature: 0.1
  max_tokens: 4096
  chunk_size: 50
  max_retries: 1
  timeout: 120
  backends:
    # Provider-agnostic: `name` is a free-form label; the actual model is
    # determined by `api_base` + `model`. Any OpenAI-compatible API works.
    # Recommended: OpenRouter + Llama 3.1 8B (~$1 for hundreds of episodes).
    - name: Example Provider
      api_base: https://openrouter.ai/api/v1
      api_key: ""                    # Your API key for the provider above
      model: meta-llama/llama-3.1-8b-instruct
      priority: 0
    # Add more backends for automatic fallback. Uncomment and adjust:
    # DeepSeek:
    #   - name: DeepSeek
    #     api_base: https://api.deepseek.com/v1
    #     api_key: ""                # Your DeepSeek API key
    #     model: deepseek-v4-flash
    #     priority: 1
    # Local Ollama (no key needed):
    #   - name: Ollama (local)
    #     api_base: http://localhost:11434/v1
    #     api_key: ""
    #     model: llama3.2:3b
    #     priority: 2

# --- Subtitle Sync ---
sync:
  engine: ffsubsync
  auto_sync: false
  default_offset: 0
  ffmpeg_path: ffmpeg

# --- Subtitle Providers ---
providers:
  enabled:
    - embedded
    - subdl
    - addic7ed
    - subscene
    - opensubtitles             # Fallback — only searched if nothing else found
  subdl:
    api_key: ""                  # Free key from subdl.com (2,000 requests + 50 downloads/day)
    pro_mode: false              # PRO: 30,000 requests + 2,000 downloads/day
  addic7ed:
    cookies: ""                  # Browser cookies for addic7ed.com
  opensubtitles:
    api_key: ""                  # .com API consumer key (opensubtitles.com/consumers)
    username: ""                 # .org VIP username (1,000 downloads/day with VIP)
    password: ""                 # .org VIP password
    tier: free                   # free (5/day) | dev (100/day) | lite (2,000) | startup (5,000) | basic (15,000) | premium (50,000) | pro (100,000) | vip (.org 1,000/day)
    daily_limit: 0               # Override daily limit (0 = use tier default)
  subscene: true
  podnapisi: true                # Disabled by default (DNS issues)
  embedded: true

# --- Subtitle Selection ---
selection:
  language_priority: [en, ja, ko, zh, fr, de, es, it, pt, ru, ar]
  acceptable_track_types: [dialogue, sdh]
  track_type_priority: [dialogue, sdh, forced, commentary, signs]

# --- Library ---
library:
  paths: []                      # Add your media directories here
  drift_threshold_ms: 200
  max_concurrent: 4
  scan_interval_hours: 0         # 0 = manual only, 6 = every 6 hours
  dry_run_default: false         # Start with real scans (not preview)
  use_identification: true       # AniList + TMDB show identification
  identify_prefer: anilist       # anilist | tmdb
  tmdb_api_key: ""               # Optional, free from themoviedb.org
  providers:
    enabled:
      - embedded
      - subdl
      - addic7ed
      - subscene
      - opensubtitles

# --- UI ---
ui:
  theme: dark
  api_key: ""                    # Optional: protects write operations (scan, translate, grab)

# --- Cost Estimation ---
# Controls translation cost tracking and estimates shown in Library scans.
# Set these to YOUR provider's published prices (per million tokens).
# Per-model overrides: add a "models" map keyed by model name for provider-specific pricing.
cost:
  input_cost_per_million: 0.14   # Example: DeepSeek ~0.14, OpenAI ~2.50 — use your provider's input price
  output_cost_per_million: 0.28  # Example: DeepSeek ~0.28, OpenAI ~10.00 — use your provider's output price
  chars_per_token: 2.5           # 2.5 for CJK, 4.0 for English
  peak_enabled: false            # Enable peak pricing multiplier (if your provider charges more at peak)
  peak_multiplier: 2.0           # Multiplier applied during peak hours
  peak_hours_utc:                # Peak hour ranges in UTC
    - [1, 4]
    - [6, 10]
  timezone: UTC                  # Your timezone for peak hour calculation
  # Per-model overrides (optional):
  # models:
  #   meta-llama/llama-3.1-8b-instruct:
  #     input_cost_per_million: 0.03
  #     output_cost_per_million: 0.05

# --- Limits ---
limits:
  max_upload_mb: 2048
  min_free_disk_mb: 1024
  max_sync_concurrent: 1
